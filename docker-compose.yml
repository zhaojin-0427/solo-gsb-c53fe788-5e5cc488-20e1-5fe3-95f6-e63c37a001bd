services:
  softproof:
    build: .
    image: prepress-softproof:latest
    container_name: prepress-softproof
    ports:
      - "8000:8000"
    volumes:
      - softproof-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  softproof-data:
